<!-- Custom head snippets for the portfolio site. -->
<!-- This site uses a light theme; declare it so that browsers which force a
     dark colour scheme onto pages without a declared preference leave the
     page readable. -->
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light only">
<style>
  html {
    color-scheme: light only;
    background-color: #ffffff;
  }
</style>
